name: se7ety
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.7
  cloud_firestore: ^7.2.0
  dio: ^5.11.1
  easy_localization: ^3.0.8
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.4.0
  gap: ^3.1.0
  go_router: ^18.1.4
  google_nav_bar: ^5.0.7
  image_picker: ^1.2.4
  lottie: ^3.8.2
  shared_preferences: ^2.5.6
  smooth_page_indicator: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
